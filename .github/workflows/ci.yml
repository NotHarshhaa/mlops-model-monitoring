name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest --cov=mlops_monitoring --cov-report=term-missing

  container:
    name: Build and scan image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mlops-model-monitoring:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mlops-model-monitoring:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
