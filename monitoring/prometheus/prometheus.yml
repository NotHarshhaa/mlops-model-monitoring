global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mlops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
