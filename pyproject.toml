[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-model-monitoring"
version = "0.1.0"
description = "End-to-end MLOps reference project for training, serving, and monitoring machine learning models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MLOps Model Monitoring contributors" }]
keywords = ["mlops", "machine-learning", "monitoring", "drift", "fastapi", "mlflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "evidently>=0.4.30,<1",
    "fastapi>=0.115,<2",
    "joblib>=1.4,<2",
    "mlflow>=2.17,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/mlops-model-monitoring"
Issues = "https://github.com/YOUR_USERNAME/mlops-model-monitoring/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::DeprecationWarning:evidently.*",
]
markers = [
    "integration: tests that exercise multiple components together",
    "monitoring: tests for drift, performance, and reporting",
]

[tool.coverage.run]
source = ["mlops_monitoring"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["mlops_monitoring"]

[tool.ruff.lint.per-file-ignores]
"src/mlops_monitoring/monitoring/reports.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
